# =========================================================
# BASE CONFIG
# =========================================================

# =========================================================
# Informasi Aplikasi
# =========================================================
spring.application.name=bedroom

# Profile aktif default. Override lewat environment variable
# SPRING_PROFILES_ACTIVE saat deploy (mis. SPRING_PROFILES_ACTIVE=prod).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# =========================================================
# JPA ? pengaturan yang konsisten di semua environment
# =========================================================
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

# =========================================================
# Flyway
# =========================================================
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# =========================================================
# Logging ? Stack Trace Dipersingkat
# =========================================================
# %ex{5} membatasi stack trace hanya 5 baris pertama, bukan ratusan baris
# "at org.springframework...", biar log tetap terbaca saat development.
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n%ex{5}

# =========================================================
# Actuator
# =========================================================
management.endpoints.web.exposure.include=health,info