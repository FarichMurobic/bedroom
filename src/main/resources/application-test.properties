# =========================================================
# TEST
# =========================================================

# =========================================================
# Basis Data (H2 In-Memory)
# =========================================================
spring.datasource.url=jdbc:h2:mem:bedroom_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

# Flyway dimatikan saat test ? skema dibuat langsung oleh Hibernate (create-drop)
spring.flyway.enabled=false

# =========================================================
# Email ? tidak benar-benar mengirim, cukup dicetak ke log
# =========================================================
bedroom.integrasi.email.alamat-pengirim=test@bedroom.local
bedroom.keamanan.verifikasi-email.url-dasar=http://localhost/verifikasi-email

# =========================================================
# Logging
# =========================================================
logging.level.com.bedroom=DEBUG
logging.level.org.springframework.security=WARN