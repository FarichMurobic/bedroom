# =========================================================
# Server
# =========================================================
server.port=8080

# =========================================================
# Basis Data (MySQL Lokal)
# =========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/bedroom_dev?useSSL=false&serverTimezone=Asia/Jakarta
spring.datasource.username=${BEDROOM_DB_USERNAME:root}
spring.datasource.password=${BEDROOM_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# Redis Lokal
# =========================================================
spring.data.redis.host=${BEDROOM_REDIS_HOST:localhost}
spring.data.redis.port=${BEDROOM_REDIS_PORT:6379}

# =========================================================
# Email ? SMTP lokal (mis. Mailtrap/Mailpit untuk uji coba tanpa kirim email asli)
# =========================================================
spring.mail.host=${BEDROOM_SMTP_HOST:localhost}
spring.mail.port=${BEDROOM_SMTP_PORT:1025}
spring.mail.username=${BEDROOM_SMTP_USERNAME:}
spring.mail.password=${BEDROOM_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

bedroom.integrasi.email.alamat-pengirim=noreply@bedroom.local
bedroom.keamanan.verifikasi-email.url-dasar=http://localhost:3000/verifikasi-email

# =========================================================
# Keamanan ? JWT (RSA, kunci uji coba lokal)
# =========================================================
bedroom.keamanan.jwt.kunci-publik=${BEDROOM_JWT_KUNCI_PUBLIK:}
bedroom.keamanan.jwt.kunci-privat=${BEDROOM_JWT_KUNCI_PRIVAT:}

# =========================================================
# Integrasi ? Twilio & Google (isi manual saat butuh uji coba fitur ini)
# =========================================================
bedroom.integrasi.twilio.account-sid=${BEDROOM_TWILIO_ACCOUNT_SID:}
bedroom.integrasi.twilio.auth-token=${BEDROOM_TWILIO_AUTH_TOKEN:}
bedroom.integrasi.twilio.nomor-pengirim=${BEDROOM_TWILIO_NOMOR_PENGIRIM:}
bedroom.integrasi.google.client-id=${BEDROOM_GOOGLE_CLIENT_ID:}

# =========================================================
# Logging ? Verbose untuk development
# =========================================================
logging.level.root=INFO
logging.level.com.bedroom=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG