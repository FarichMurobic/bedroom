name: CI - Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn --batch-mode clean compile

      - name: Run tests & verify
        run: mvn --batch-mode verify

      - name: Show test summary
        if: always()
        run: |
          echo "Test Results:"
          grep -E "Tests run:.*Failures:.*Errors:.*Skipped:" target/surefire-reports/*.txt || echo "No test report found"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/

      - name: Notify on failure
        if: failure()
        run: echo "Build or tests failed! Check the logs above."